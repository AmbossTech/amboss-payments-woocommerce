on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Self-check
        run: php -d zend.assertions=1 -d assert.exception=1 tests/selfcheck.php

      - name: Build zip
        run: scripts/build-zip.sh "$TAG" HEAD

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" amboss-payments.zip --clobber

      # The SVN secrets reach only the deploy step. The deploy runs after they exist.
      - name: Check for WordPress.org secrets
        id: svn
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: echo "configured=${SVN_USERNAME:+true}" >> "$GITHUB_OUTPUT"

      - name: Prepare the WordPress.org build
        if: steps.svn.outputs.configured == 'true'
        run: |
          unzip -q amboss-payments.zip -d build
          sed -i "s/^Stable tag: .*/Stable tag: ${TAG#v}/" build/amboss-payments/readme.txt

      - name: Deploy to WordPress.org
        if: steps.svn.outputs.configured == 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SLUG: amboss-payments
          VERSION: ${{ env.TAG }}
          BUILD_DIR: build/amboss-payments
          ASSETS_DIR: .wordpress-org
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
